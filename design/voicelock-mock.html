  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0b0c0e}
    @keyframes vlBlink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
    @keyframes vlFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes vlRec{from{width:0%}to{width:100%}}
    @keyframes vlPulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes vlSpin{to{transform:rotate(360deg)}}
  </style>
</helmet>
<div style="min-height:100vh;width:100%;display:grid;place-items:center;padding:32px;background:radial-gradient(120% 90% at 50% -10%, #1c1f24 0%, #0d0e11 55%, #08090b 100%);font-family:'Space Grotesk',system-ui,sans-serif;color:#e7e9ee">

  <div style="width:min(1060px,95vw);height:min(680px,88vh);display:flex;border-radius:30px;overflow:hidden;position:relative;background:linear-gradient(150deg,#17191e,#101216);border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 120px -30px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05)">

    <!-- ===================== LEFT: PROFILE PICKER ===================== -->
    <aside style="width:326px;flex:none;display:flex;flex-direction:column;padding:26px 22px;background:rgba(255,255,255,.018);border-right:1px solid rgba(255,255,255,.06)">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(150deg,#2b2f37,#171a1f);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c9cdd6" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2.5"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        </div>
        <div>
          <div style="font-size:16px;font-weight:600;letter-spacing:-.01em">VoiceLock</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6f7681;letter-spacing:.06em">OFFLINE Â· VOICE VAULT</div>
        </div>
      </div>

      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5f6673;letter-spacing:.12em;margin:26px 4px 12px">PROFILES</div>

      <div style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px">
        <sc-for list="{{ profiles }}" as="p" hint-placeholder-count="2">
          <button onclick="{{ p.select }}" style="{{ p.rowStyle }}" style-hover="border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.05)">
            <div style="{{ p.avatarStyle }}">{{ p.initial }}</div>
            <div style="flex:1;text-align:left;min-width:0">
              <div style="font-size:14px;font-weight:500;color:#e7e9ee">{{ p.name }}</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6f7681;letter-spacing:.04em">{{ p.meta }}</div>
            </div>
            <div style="{{ p.dotStyle }}"></div>
          </button>
        </sc-for>

        <button onclick="{{ startEnroll }}" style="{{ enrollRowStyle }}" style-hover="border-color:rgba(120,170,255,.4);color:#dfe6f2">
          <div style="width:38px;height:38px;flex:none;border-radius:11px;border:1.5px dashed rgba(255,255,255,.22);display:grid;place-items:center;font-size:20px;font-weight:400;line-height:1">+</div>
          <div style="text-align:left">
            <div style="font-size:14px;font-weight:500">Enroll new voice</div>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6f7681;letter-spacing:.04em">name Â· passphrase Â· sample</div>
          </div>
        </button>
      </div>

      <div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:9px">
        <div style="width:8px;height:8px;border-radius:50%;background:{{ accentCss }};box-shadow:0 0 10px {{ accentGlow }};transition:all .4s"></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8a8f99;letter-spacing:.08em">{{ statusLine }}</div>
      </div>
    </aside>

    <!-- ===================== RIGHT: BOOTH / ENROLL ===================== -->
    <main style="flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;background:radial-gradient(90% 70% at 50% 32%, rgba(255,255,255,.02), transparent 70%)">

      <!-- glass tint that follows accent -->
      <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 40%, {{ ambientTint }}, transparent 72%);transition:background .6s"></div>

      <!-- ---------- BOOTH ---------- -->
      <sc-if value="{{ isBooth }}" hint-placeholder-val="{{ true }}">
      <div style="position:relative;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:20px">

        <div style="display:flex;align-items:center;gap:8px;padding:6px 13px;border-radius:100px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)">
          <div style="width:6px;height:6px;border-radius:50%;background:{{ accentCss }};box-shadow:0 0 8px {{ accentGlow }};animation:{{ badgePulse }}"></div>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#b9bfca">{{ modeBadge }}</span>
        </div>

        <!-- expressive face -->
        <div style="position:relative;width:172px;height:172px;display:grid;place-items:center">
          <div style="position:absolute;inset:-22px;border-radius:50%;background:radial-gradient(circle, {{ faceGlow }}, transparent 66%);filter:blur(4px);transition:background .5s"></div>
          <div style="position:absolute;inset:0;border-radius:50%;background:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 -20px 40px -20px rgba(0,0,0,.6)"></div>
          <svg viewBox="0 0 100 100" width="118" height="118" style="position:relative;overflow:visible">
            <g style="animation:vlBlink 5.4s infinite;transform-origin:50px 44px">
              <rect x="33.5" y="35" width="7" height="18" rx="3.5" fill="#eef0f5"></rect>
              <rect x="59.5" y="35" width="7" height="18" rx="3.5" fill="#eef0f5"></rect>
            </g>
            <path d="{{ mouthPath }}" fill="none" stroke="{{ faceStroke }}" stroke-width="6" stroke-linecap="round" style="transition:d .45s, stroke .45s"></path>
          </svg>
        </div>

        <div style="text-align:center;min-height:58px">
          <div style="font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.15">{{ promptText }}</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:{{ subColor }};letter-spacing:.03em;margin-top:7px;transition:color .4s">{{ subText }}</div>
        </div>

        <canvas ref="{{ canvasRef }}" style="width:100%;max-width:440px;height:96px;display:block"></canvas>

        <!-- READY controls -->
        <sc-if value="{{ isReady }}" hint-placeholder-val="{{ false }}">
        <div style="width:100%;display:flex;flex-direction:column;gap:12px;animation:vlFade .35s ease">
          <div style="position:relative">
            <input value="{{ passInput }}" onchange="{{ onPass }}" type="password" placeholder="Enter passphrase" style="width:100%;padding:13px 15px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);color:#e7e9ee;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.04em;outline:none" style-focus="border-color:rgba(120,170,255,.5);background:rgba(120,170,255,.06)">
          </div>
          <button onclick="{{ speak }}" style="width:100%;padding:15px;border-radius:14px;border:1px solid rgba(120,170,255,.35);background:linear-gradient(150deg,rgba(120,170,255,.22),rgba(120,170,255,.08));color:#eaf1ff;font-family:'Space Grotesk';font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s" style-hover="background:linear-gradient(150deg,rgba(120,170,255,.34),rgba(120,170,255,.16))">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
            Speak to unlock
          </button>
        </div>
        </sc-if>

        <!-- IDLE hint -->
        <sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6f7681;letter-spacing:.03em;padding:6px 0">â† select a profile to begin</div>
        </sc-if>

        <!-- PROGRESS -->
        <sc-if value="{{ showProgress }}" hint-placeholder-val="{{ false }}">
        <button onclick="{{ reset }}" style="padding:11px 20px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#9aa0aa;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;cursor:pointer">CANCEL</button>
        </sc-if>

        <!-- RESULT -->
        <sc-if value="{{ showResult }}" hint-placeholder-val="{{ false }}">
        <button onclick="{{ reset }}" style="{{ resultBtnStyle }}" style-hover="filter:brightness(1.12)">{{ resultBtnLabel }}</button>
        </sc-if>

        <!-- DEMO CONTROLS -->
        <sc-if value="{{ showDemo }}" hint-placeholder-val="{{ false }}">
        <div style="width:100%;margin-top:4px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#5f6673;letter-spacing:.14em;text-align:center;margin-bottom:10px">DEMO â€” WATCH IT REJECT THREE IMPOSTORS</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
            <button onclick="{{ demoCorrect }}" style="{{ chipGood }}" style-hover="border-color:rgba(90,210,150,.5)">âœ“ Correct</button>
            <button onclick="{{ demoWrongPass }}" style="{{ chip }}" style-hover="border-color:rgba(255,120,120,.5)">âœ— Wrong passphrase</button>
            <button onclick="{{ demoWrongVoice }}" style="{{ chip }}" style-hover="border-color:rgba(255,120,120,.5)">âœ— Wrong voice</button>
            <button onclick="{{ demoReplay }}" style="{{ chip }}" style-hover="border-color:rgba(255,120,120,.5)">â†º Replay attack</button>
          </div>
        </div>
        </sc-if>

      </div>
      </sc-if>

      <!-- ---------- ENROLL ---------- -->
      <sc-if value="{{ isEnroll }}" hint-placeholder-val="{{ false }}">
      <div style="position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;animation:vlFade .35s ease">
        <div>
          <div style="font-size:23px;font-weight:600;letter-spacing:-.02em">Enroll a new voice</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#6f7681;margin-top:5px">two stacked locks â€” passphrase wraps voice</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:11px">
          <div>
            <label style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#7a808b;letter-spacing:.1em;display:block;margin-bottom:6px">NAME</label>
            <input value="{{ eName }}" onchange="{{ onEName }}" placeholder="e.g. Ana" style="width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);color:#e7e9ee;font-family:'Space Grotesk';font-size:14px;outline:none" style-focus="border-color:rgba(120,170,255,.5)">
          </div>
          <div>
            <label style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#7a808b;letter-spacing:.1em;display:block;margin-bottom:6px">PASSPHRASE (OUTER LOCK)</label>
            <input value="{{ ePass }}" onchange="{{ onEPass }}" type="password" placeholder="something only you know" style="width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);color:#e7e9ee;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.04em;outline:none" style-focus="border-color:rgba(120,170,255,.5)">
          </div>
        </div>

        <div>
          <label style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#7a808b;letter-spacing:.1em;display:block;margin-bottom:6px">VOICE SAMPLE (INNER LOCK)</label>
          <canvas ref="{{ canvasRef }}" style="width:100%;height:64px;display:block;margin-bottom:8px"></canvas>
          <button onclick="{{ toggleRecord }}" style="{{ recBtnStyle }}">
            <div style="{{ recDotStyle }}"></div>
            <span>{{ recLabel }}</span>
          </button>
          <div style="height:3px;border-radius:3px;background:rgba(255,255,255,.06);margin-top:9px;overflow:hidden">
            <div style="{{ recProgressStyle }}"></div>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:4px">
          <button onclick="{{ cancelEnroll }}" style="flex:none;padding:13px 20px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#9aa0aa;font-family:'Space Grotesk';font-size:14px;font-weight:500;cursor:pointer">Cancel</button>
          <button onclick="{{ saveEnroll }}" style="{{ saveBtnStyle }}">Create voice vault</button>
        </div>
      </div>
      </sc-if>

    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1080, &quot;height&quot;: 720 },
  &quot;visualizerStyle&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;bars&quot;,&quot;orb&quot;,&quot;rings&quot;], &quot;default&quot;: &quot;bars&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Booth&quot; },
  &quot;showChallenge&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Booth&quot; },
  &quot;showDemoControls&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Booth&quot; }
}">
class Component extends DCLogic {
  state = {
    profiles: [
      { name: 'Ana', pass: 'welcome', meta: 'enrolled Â· 12s sample' },
      { name: 'Marco', pass: 'orbit7', meta: 'enrolled Â· 9s sample' },
    ],
    selected: null,
    mode: 'idle',            // idle ready enroll listening processing accept reject
    passInput: '',
    challenge: '',
    welcomeName: '',
    rejectReason: '',
    // enroll
    eName: '', ePass: '', eRecording: false, eRecorded: false,
  };

  ACCENTS = {
    idle:[150,156,166], ready:[150,156,166], enroll:[150,156,166],
    listening:[86,150,255], processing:[150,156,166],
    accept:[74,204,146], reject:[240,96,96],
  };

  constructor(props){ super(props); this.level = 0.12; this.canvasEl = null; this._timers = []; }

  componentDidMount(){ this.state.challenge = this.getChallenge(); this.loop = this.loop.bind(this); this._raf = requestAnimationFrame(this.loop); }
  componentWillUnmount(){ cancelAnimationFrame(this._raf); this.clearTimers(); }

  clearTimers(){ this._timers.forEach(clearTimeout); this._timers = []; }
  getChallenge(){
    const nums = ['seven','four','nine','two','five','eight','one','six'];
    const cols = ['blue','red','gold','green','grey','teal'];
    const r = a => a[Math.floor(Math.random()*a.length)];
    return `${r(nums)} Â· ${r(nums)} Â· ${r(cols)}`;
  }
  accentRGB(){ return this.ACCENTS[this.state.mode] || this.ACCENTS.idle; }

  // ---------- animation ----------
  loop(){
    const c = this.canvasEl;
    if (c && c.isConnected){
      const rect = c.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = rect.width, h = rect.height;
      if (w && h){
        if (c.width !== Math.round(w*dpr)){ c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); }
        const ctx = c.getContext('2d');
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.clearRect(0,0,w,h);
        const active = this.state.mode === 'listening' || this.state.eRecording;
        const target = active ? 0.92 : (this.state.mode === 'processing' ? 0.34 : 0.11);
        this.level += (target - this.level) * 0.11;
        const t = performance.now()/1000;
        const [r,g,b] = this.accentRGB();
        const style = this.props.visualizerStyle || 'bars';
        if (style === 'orb') this.drawOrb(ctx,w,h,t,r,g,b);
        else if (style === 'rings') this.drawRings(ctx,w,h,t,r,g,b);
        else this.drawBars(ctx,w,h,t,r,g,b);
      }
    }
    this._raf = requestAnimationFrame(this.loop);
  }

  drawBars(ctx,w,h,t,r,g,b){
    const n = 34, cy = h/2, bw = 3.2, gap = (w - n*bw) / (n+1);
    for (let i=0;i<n;i++){
      const d = Math.abs(i-(n-1)/2)/((n-1)/2);
      const env = 1 - d*d*0.85;
      const v = (0.32 + 0.68*Math.abs(Math.sin(i*0.7 + t*4.2))*Math.abs(Math.cos(i*0.31 - t*2.1)));
      const bh = Math.max(3, h*0.10 + v*this.level*env*h*0.82);
      const x = gap + i*(bw+gap);
      ctx.fillStyle = `rgba(${r},${g},${b},${0.5 + 0.45*env})`;
      const y = cy - bh/2, rad = bw/2;
      ctx.beginPath();
      ctx.roundRect(x, y, bw, bh, rad);
      ctx.fill();
    }
  }

  drawOrb(ctx,w,h,t,r,g,b){
    const cx=w/2, cy=h/2, base=Math.min(w,h)*0.30;
    const R = base + Math.sin(t*2.4)*base*0.06 + this.level*base*0.34*(0.6+0.4*Math.sin(t*6));
    const grad = ctx.createRadialGradient(cx,cy,R*0.1,cx,cy,R*1.35);
    grad.addColorStop(0,`rgba(${r},${g},${b},${0.55})`);
    grad.addColorStop(0.6,`rgba(${r},${g},${b},${0.16})`);
    grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(cx,cy,R*1.35,0,7); ctx.fill();
    ctx.strokeStyle=`rgba(${r},${g},${b},${0.75})`; ctx.lineWidth=2;
    ctx.beginPath();
    for(let a=0;a<=Math.PI*2+0.01;a+=0.14){
      const rr=R*(1+this.level*0.10*Math.sin(a*4+t*4));
      const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
      a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  drawRings(ctx,w,h,t,r,g,b){
    const cx=w/2, cy=h/2, m=Math.min(w,h);
    for(let k=0;k<5;k++){
      const rad = m*(0.10 + k*0.085) + this.level*10*Math.sin(t*2.2 - k*0.7);
      const al = (1 - k/5.5) * (0.22 + 0.78*this.level);
      ctx.strokeStyle=`rgba(${r},${g},${b},${al})`;
      ctx.lineWidth = k===0?2.2:1.4;
      ctx.beginPath(); ctx.arc(cx,cy,Math.max(2,rad),0,7); ctx.stroke();
    }
    ctx.fillStyle=`rgba(${r},${g},${b},${0.5+0.5*this.level})`;
    ctx.beginPath(); ctx.arc(cx,cy,3.4,0,7); ctx.fill();
  }

  // ---------- flows ----------
  selectProfile(i){
    this.clearTimers();
    this.setState({ selected:i, mode:'ready', passInput:'', challenge:this.getChallenge(), welcomeName:'', rejectReason:'' });
  }
  runFlow(kind, arg){
    this.clearTimers();
    this.setState({ mode:'listening', welcomeName:'', rejectReason:'' });
    this._timers.push(setTimeout(()=>{
      this.setState({ mode:'processing' });
      this._timers.push(setTimeout(()=>{
        if (kind === 'accept') this.setState({ mode:'accept', welcomeName:arg });
        else this.setState({ mode:'reject', rejectReason:arg });
      }, 1050));
    }, 2100));
  }
  speak(){
    if (this.state.selected == null) return;
    const prof = this.state.profiles[this.state.selected];
    const p = (this.state.passInput||'').trim().toLowerCase();
    if (p !== prof.pass) this.runFlow('reject', 'Passphrase incorrect â€” outer lock held');
    else this.runFlow('accept', prof.name);
  }
  demoCorrect(){ const n = this.state.selected!=null ? this.state.profiles[this.state.selected].name : 'Ana'; this.runFlow('accept', n); }
  demoWrongPass(){ this.runFlow('reject', 'Passphrase incorrect â€” outer lock held'); }
  demoWrongVoice(){ this.runFlow('reject', "Voice didn't match â€” inner lock won't open"); }
  demoReplay(){ this.runFlow('reject', 'Liveness failed â€” challenge phrase not spoken'); }
  reset(){ this.clearTimers(); this.setState({ mode: this.state.selected!=null ? 'ready':'idle', passInput:'', welcomeName:'', rejectReason:'' }); }

  // ---------- enroll ----------
  startEnroll(){ this.clearTimers(); this.setState({ mode:'enroll', eName:'', ePass:'', eRecording:false, eRecorded:false }); }
  cancelEnroll(){ this.setState({ mode: this.state.selected!=null ? 'ready':'idle' }); }
  toggleRecord(){
    if (this.state.eRecording) return;
    this.setState({ eRecording:true, eRecorded:false });
    this._timers.push(setTimeout(()=> this.setState({ eRecording:false, eRecorded:true }), 3000));
  }
  saveEnroll(){
    const { eName, ePass, eRecorded } = this.state;
    if (!eName.trim() || !ePass.trim() || !eRecorded) return;
    const profiles = this.state.profiles.concat([{ name:eName.trim(), pass:ePass.trim().toLowerCase(), meta:'enrolled Â· just now' }]);
    this.setState({ profiles, selected:profiles.length-1, mode:'ready', passInput:'', challenge:this.getChallenge() });
  }

  renderVals(){
    const s = this.state;
    const [r,g,b] = this.accentRGB();
    const accentCss = `rgb(${r},${g},${b})`;
    const accentGlow = `rgba(${r},${g},${b},.6)`;
    const isBooth = s.mode !== 'enroll';
    const isEnroll = s.mode === 'enroll';
    const isIdle = s.mode === 'idle';
    const isReady = s.mode === 'ready';
    const showProgress = s.mode === 'listening' || s.mode === 'processing';
    const showResult = s.mode === 'accept' || s.mode === 'reject';
    const showDemo = (this.props.showDemoControls ?? true) && isReady;

    // face
    const mouths = {
      idle:'M37 63 Q50 67 63 63', ready:'M37 63 Q50 68 63 63',
      listening:'M40 64 Q50 70 60 64', processing:'M38 64 L62 64',
      accept:'M33 60 Q50 80 67 60', reject:'M33 71 Q50 55 67 71', enroll:'M37 63 Q50 68 63 63',
    };
    const mouthPath = mouths[s.mode] || mouths.ready;
    const faceStroke = (s.mode==='accept'||s.mode==='reject') ? accentCss : '#eef0f5';
    const faceGlow = `rgba(${r},${g},${b},${s.mode==='listening'?0.34:(showResult?0.30:0.14)})`;
    const ambientTint = `rgba(${r},${g},${b},${s.mode==='idle'||s.mode==='ready'?0.03:0.07})`;

    // prompt / sub
    const prof = s.selected!=null ? s.profiles[s.selected] : null;
    const showChallenge = this.props.showChallenge ?? true;
    const prompts = {
      idle:'Ready to listen', ready: prof?`Hi, ${prof.name}.`:'Ready',
      listening:'Listeningâ€¦', processing:'Verifying voiceâ€¦',
      accept:`Welcome, ${s.welcomeName}.`, reject:'Access denied',
    };
    const subs = {
      idle:'no profile selected', ready: showChallenge?`say: "${s.challenge}"`:'passphrase + voice required',
      listening:'capturing audio Â· challenge-response', processing:'peeling two locks â€” passphrase, then voice',
      accept:'voiceprint + passphrase verified', reject:s.rejectReason,
    };
    const promptText = prompts[s.mode] || '';
    const subText = subs[s.mode] || '';
    const subColor = s.mode==='reject' ? accentCss : (s.mode==='accept'?accentCss:'#6f7681');

    const badgeMap = { idle:'READY', ready:'READY', listening:'â— LISTENING', processing:'VERIFYING', accept:'ACCESS GRANTED', reject:'ACCESS DENIED', enroll:'ENROLLING' };
    const modeBadge = badgeMap[s.mode];
    const badgePulse = (s.mode==='listening'||s.mode==='processing') ? 'vlPulse 1.1s infinite' : 'none';
    const statusLine = { idle:'LOCKED Â· IDLE', ready:'LOCKED Â· READY', listening:'CAPTURINGâ€¦', processing:'VERIFYINGâ€¦', accept:`UNLOCKED Â· ${(s.welcomeName||'').toUpperCase()}`, reject:'LOCKED Â· DENIED', enroll:'ENROLLINGâ€¦' }[s.mode];

    // result button
    const isAccept = s.mode==='accept';
    const resultBtnLabel = isAccept ? 'Lock again' : 'Try again';
    const resultBtnStyle = `padding:12px 26px;border-radius:13px;border:1px solid rgba(${r},${g},${b},.4);background:linear-gradient(150deg,rgba(${r},${g},${b},.22),rgba(${r},${g},${b},.08));color:#eef1f5;font-family:'Space Grotesk';font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;animation:vlFade .35s ease`;

    // profiles
    const profiles = s.profiles.map((p,i)=>{
      const sel = i===s.selected;
      return {
        name:p.name, meta:p.meta, initial:p.name[0].toUpperCase(),
        select: ()=>this.selectProfile(i),
        rowStyle:`display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;cursor:pointer;transition:all .2s;background:${sel?'rgba(255,255,255,.055)':'rgba(255,255,255,.02)'};border:1px solid ${sel?accentCss+'66':'rgba(255,255,255,.06)'}`,
        avatarStyle:`width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:15px;font-weight:600;color:#e7e9ee;background:linear-gradient(150deg,#2c313a,#191c21);border:1px solid rgba(255,255,255,.09)`,
        dotStyle:`width:7px;height:7px;flex:none;border-radius:50%;background:${sel?accentCss:'transparent'};box-shadow:${sel?'0 0 8px '+accentGlow:'none'};transition:all .3s`,
      };
    });
    const enrollRowStyle = `display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;cursor:pointer;transition:all .2s;background:transparent;border:1px solid rgba(255,255,255,.06);color:#9aa0aa;margin-top:2px`;

    // enroll widgets
    const rec = s.eRecording, done = s.eRecorded;
    const recLabel = rec ? 'Recordingâ€¦ speak now' : (done ? 'âœ“ Captured 3.0s â€” re-record' : 'â— Record 3-second sample');
    const recBtnStyle = `width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:12px;cursor:${rec?'default':'pointer'};font-family:'Space Grotesk';font-size:13.5px;font-weight:500;transition:all .2s;border:1px solid ${rec?'rgba(86,150,255,.5)':(done?'rgba(74,204,146,.4)':'rgba(255,255,255,.12)')};background:${rec?'rgba(86,150,255,.12)':(done?'rgba(74,204,146,.1)':'rgba(255,255,255,.03)')};color:${rec?'#bcd4ff':(done?'#a6ecc9':'#c9cdd6')}`;
    const recDotStyle = `width:9px;height:9px;border-radius:50%;background:${rec?'#5696ff':(done?'#4acc92':'#ff6b6b')};box-shadow:0 0 8px ${rec?'rgba(86,150,255,.7)':'transparent'};animation:${rec?'vlPulse 1s infinite':'none'}`;
    const recProgressStyle = `height:100%;background:linear-gradient(90deg,#5696ff,#8ab4ff);width:${done?'100%':'0%'};${rec?'animation:vlRec 3s linear forwards;':''}`;
    const canSave = s.eName.trim() && s.ePass.trim() && s.eRecorded;
    const saveBtnStyle = `flex:1;padding:13px;border-radius:13px;font-family:'Space Grotesk';font-size:14px;font-weight:600;cursor:${canSave?'pointer':'not-allowed'};transition:all .2s;border:1px solid ${canSave?'rgba(120,170,255,.4)':'rgba(255,255,255,.08)'};background:${canSave?'linear-gradient(150deg,rgba(120,170,255,.24),rgba(120,170,255,.1))':'rgba(255,255,255,.03)'};color:${canSave?'#eaf1ff':'#5f6673'}`;

    const chip = `padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.025);color:#aeb3bd;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.02em;cursor:pointer;transition:all .2s`;
    const chipGood = `padding:8px 12px;border-radius:10px;border:1px solid rgba(74,204,146,.35);background:rgba(74,204,146,.08);color:#a6ecc9;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.02em;cursor:pointer;transition:all .2s`;

    return {
      profiles, enrollRowStyle,
      accentCss, accentGlow, ambientTint, statusLine,
      isBooth, isEnroll, isIdle, isReady, showProgress, showResult, showDemo,
      mouthPath, faceStroke, faceGlow, promptText, subText, subColor, modeBadge, badgePulse,
      resultBtnStyle, resultBtnLabel,
      passInput:s.passInput, onPass:e=>this.setState({passInput:e.target.value}),
      speak:()=>this.speak(), reset:()=>this.reset(),
      demoCorrect:()=>this.demoCorrect(), demoWrongPass:()=>this.demoWrongPass(),
      demoWrongVoice:()=>this.demoWrongVoice(), demoReplay:()=>this.demoReplay(),
      startEnroll:()=>this.startEnroll(), cancelEnroll:()=>this.cancelEnroll(),
      eName:s.eName, ePass:s.ePass, onEName:e=>this.setState({eName:e.target.value}), onEPass:e=>this.setState({ePass:e.target.value}),
      toggleRecord:()=>this.toggleRecord(), saveEnroll:()=>this.saveEnroll(),
      recLabel, recBtnStyle, recDotStyle, recProgressStyle, saveBtnStyle,
      chip, chipGood,
      canvasRef:(el)=>{ this.canvasEl = el; },
    };
  }
}
</script>
