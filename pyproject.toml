[project]
name = "voicelock"
version = "0.1.0"
description = "Local offline voice biometric profile vault (learning demo)"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.35",
    "numpy>=2.0,<2.3",
    "opencv-contrib-python>=4.13,<5",
    "pynacl>=1.6.2",
    "pywebview>=6.2.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "speechbrain>=1.1.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

[project.scripts]
voicelock = "voicelock.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicelock"]

[tool.hatch.build.targets.wheel.force-include]
"src/voicelock/ui/index.html" = "voicelock/ui/index.html"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
