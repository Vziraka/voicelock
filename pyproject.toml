[project]
name = "voicelock"
version = "0.1.0"
description = "Local offline voice biometric profile vault (learning demo)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<2.3",
    "pywebview>=6.2.1",
    "sounddevice>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
